<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

// ===== PeerJS カメラ受信 =====
let cameraPeer = null;
let cameraConnectedRoomId = null;

function connectCamera(roomId) {
  if (cameraConnectedRoomId === roomId) return; // すでに接続済み
  if (cameraPeer) { try { cameraPeer.destroy(); } catch(e) {} }
  cameraConnectedRoomId = roomId;

  cameraPeer = new Peer();
  cameraPeer.on('open', myId => {
    const dc = cameraPeer.connect('ippon-host-' + roomId);
    dc.on('open', () => dc.send('join:' + myId));
    dc.on('error', () => { cameraConnectedRoomId = null; });
  });
  cameraPeer.on('call', call => {
    call.answer();
    call.on('stream', stream => {
      const v = document.getElementById('camera-video');
      v.srcObject = stream;
    });
  });
  cameraPeer.on('error', () => { cameraConnectedRoomId = null; });
}

function showCameraVideo(show) {
  document.getElementById('camera-video').style.display = show ? 'block' : 'none';
}

const app = initializeApp(firebaseConfig);

let currentVotes = 0;
let currentRevealed = false;

window.goFullscreen = () => {
  document.documentElement.requestFullscreen();
  document.getElementById('fullscreen-btn').style.display = 'none';
};

let ipponTriggered = false;
let imageQueue = [];
let isPlayingImageQueue = false;
let displayedVotes = 0; // キューで表示中の票数

function enqueueImages(fromVotes, toVotes) {
  for (let i = fromVotes + 1; i <= toVotes; i++) {
    imageQueue.push(i);
  }
  if (!isPlayingImageQueue) playNextImage();
}

function playNextImage() {
  if (imageQueue.length === 0) {
    isPlayingImageQueue = false;
    return;
  }
  isPlayingImageQueue = true;
  const votes = imageQueue.shift();
  displayedVotes = votes;
  showVoteImage(votes);
  setTimeout(playNextImage, 150);
}

function showScoreImg(n) {
  document.querySelectorAll('[id^="score-img-"]').forEach(el => el.style.display = 'none');
  const img = document.getElementById('score-img');
  const cached = document.getElementById('score-img-' + n);
  if (cached) {
    img.style.display = 'none';
    cached.style.display = 'block';
  } else {
    if (images['main_' + n]) img.src = images['main_' + n];
    img.style.display = 'block';
  }
}
function showKekkaImg(n) {
  document.querySelectorAll('[id^="kekka-img-"]').forEach(el => el.style.display = 'none');
  const badge = document.getElementById('score-badge');
  const cached = document.getElementById('kekka-img-' + n);
  if (cached) {
    badge.style.display = 'none';
    cached.style.display = 'block';
  } else {
    if (images['kekka_' + n]) badge.src = images['kekka_' + n];
    badge.style.display = 'block';
  }
}
function hideScoreImg() {
  document.querySelectorAll('[id^="score-img-"]').forEach(el => el.style.display = 'none');
  document.getElementById('score-img').style.display = 'none';
}
function hideKekkaImg() {
  document.querySelectorAll('[id^="kekka-img-"]').forEach(el => el.style.display = 'none');
  document.getElementById('score-badge').style.display = 'none';
}

function showVoteImage(votes) {
  if (ipponTriggered) return;
  if (currentMode === 'scoreboard') return;

  if (votes >= 6) {
    ipponTriggered = true;
    const agendaImg = document.getElementById('agenda-img');
    const agendaVideo = document.getElementById('agenda-video');
    agendaImg.style.display = 'none'; document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
    agendaVideo.pause(); agendaVideo.style.display = 'none'; agendaVideo.src = '';
    stopConfetti(document.getElementById('confetti-layer'));
    showKekkaImg(6);
    showCameraVideo(false);
  } else if (currentRevealed) {
    showScoreImg(votes);  // フレーム枠を表示（透過PNGなのでカメラが透ける）
    showKekkaImg(votes);
  } else {
    showScoreImg(votes);  // フレーム枠を表示
    hideKekkaImg();
  }
}

function updateUI() {
  if (ipponTriggered) return;
  if (currentMode === 'scoreboard') return;

  if (currentMode === 'saiten') {
    showCameraVideo(true);
    showScoreImg(currentVotes);  // フレーム枠は常に表示
    if (currentRevealed) {
      showKekkaImg(currentVotes);
    } else {
      hideKekkaImg();
    }
  } else {
    showCameraVideo(false);
    if (currentRevealed) {
      showScoreImg(currentVotes);
      showKekkaImg(currentVotes);
    } else {
      showScoreImg(currentVotes);
      hideKekkaImg();
    }
  }
}

onValue(ref(db, 'agenda'), (snapshot) => {
  const agendaVideo = document.getElementById('agenda-video');
  const confettiLayer = document.getElementById('confetti-layer');
  const url = snapshot.val();

  // 全agenda-img-*を非表示
  document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');

  if (url) {
    const isVideo = url.includes('.mp4') || url.includes('.webm') || url.includes('.mov');
    stopConfetti(confettiLayer);
    if (isVideo) {
      // 動画: 同じURLなら再利用、違うURLなら新規セット
      if (agendaVideo.getAttribute('src') !== url) {
        agendaVideo.src = url;
      }
      agendaVideo.style.display = 'block';
      agendaVideo.onended = () => remove(ref(db, 'agenda'));
      agendaVideo.play().catch(e => console.error(e));
      // 画像を隠す
      document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
      document.getElementById('agenda-img').style.display = 'none';
    } else {
      // 画像: 動画映像は隠すが音声は止めない
      agendaVideo.style.display = 'none';
      const cached = document.querySelector('.agenda-img-cache[data-src="' + url + '"]');
      if (cached) {
        cached.style.display = 'block';
      } else {
        const agendaImg = document.getElementById('agenda-img');
        agendaImg.src = url;
        agendaImg.style.display = 'block';
      }
      if (url.includes('winner')) startConfetti(confettiLayer);
    }
  } else {
    // agendaがnullになったとき（停止）は完全停止
    agendaVideo.pause(); agendaVideo.style.display = 'none'; agendaVideo.src = '';
    document.getElementById('agenda-img').style.display = 'none';
    stopConfetti(confettiLayer);
  }
});

onValue(ref(db, 'answer_text'), (snapshot) => {
  const el = document.getElementById('agenda-text');
  const answerEl = document.getElementById('agenda-text-answer');
  const nameEl = document.getElementById('agenda-text-name');
  const val = snapshot.val();
  if (val) {
    try {
      const data = JSON.parse(val);
      answerEl.textContent = data.answer || '';
      nameEl.textContent = data.name || '';
    } catch(e) {
      answerEl.textContent = val;
      nameEl.textContent = '';
    }
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
    answerEl.textContent = '';
    nameEl.textContent = '';
  }
});

function startConfetti(layer) {
  layer.innerHTML = '';
  const colors = ['#FFD700','#FFC200','#FFB800','#FFD000','#FFCA00','#FFE566','#E8A800'];
  for (let i = 0; i < 150; i++) {
    const el = document.createElement('div');
    el.className = 'cp';
    const w = Math.random() * 12 + 7;
    const h = Math.random() * 20 + 10;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = Math.random() * 100;
    const dur = Math.random() * 2.5 + 2;
    const swayDur = Math.random() * 1.5 + 1;
    const delay = Math.random() * -5;
    el.style.cssText = `width:${w}px;height:${h}px;background:${color};left:${left}%;animation-duration:${dur}s,${swayDur}s;animation-delay:${delay}s,${delay}s;opacity:${Math.random()*0.5+0.5};`;
    layer.appendChild(el);
  }
  layer.style.display = 'block';
}

function stopConfetti(layer) {
  layer.style.display = 'none';
  layer.innerHTML = '';
}

onValue(ref(db, 'mode'), (snapshot) => {
  const mode = snapshot.val();
  currentMode = mode || '';
  const sb = document.getElementById('scoreboard');
  if (mode === 'scoreboard') {
    sb.classList.add('visible');
    document.getElementById('score-badge').style.display = 'none';
    const agendaImg = document.getElementById('agenda-img');
    const agendaVideo = document.getElementById('agenda-video');
    agendaImg.style.display = 'none'; document.querySelectorAll('.agenda-img-cache').forEach(el => el.style.display = 'none');
    agendaVideo.pause(); agendaVideo.style.display = 'none'; agendaVideo.src = '';
    stopConfetti(document.getElementById('confetti-layer'));
  } else if (mode === 'agenda') {
    sb.classList.remove('visible');
    document.getElementById('score-badge').style.display = 'none';
    hideScoreImg();
    document.getElementById('taiki-img').style.display = 'none';
    document.getElementById('odai-img').style.display = 'none'; [1,2,3,4,5,6].forEach(function(n){var el=document.getElementById('odai-img-'+n);if(el)el.style.display='none';});
  } else {
    sb.classList.remove('visible');
    document.getElementById('score-badge').style.display = 'none';
  }
  if (mode === 'saiten') {
    ipponTriggered = false;
    imageQueue = [];
    isPlayingImageQueue = false;
    displayedVotes = 0;
    showCameraVideo(true);
    showScoreImg(0);  // フレーム枠（main_0.png）を表示、透過PNGなのでカメラが透ける

    showCameraVideo(false);

});

let voteDebounceTimer = null;
let latestVoteCount = 0;

onValue(ref(db, 'votes'), (snapshot) => {
  const allVotes = snapshot.val() || {};
  latestVoteCount = Math.min(Object.keys(allVotes).length, 6);

  clearTimeout(voteDebounceTimer);
  voteDebounceTimer = setTimeout(() => {
    const newVotes = latestVoteCount;
    if (newVotes === 0) {
      currentVotes = 0;
      ipponTriggered = false;
      imageQueue = [];
      isPlayingImageQueue = false;
      displayedVotes = 0;
      updateUI();
    } else if (newVotes > currentVotes) {
      const from = Math.max(currentVotes, displayedVotes);
      currentVotes = newVotes;
      enqueueImages(from, newVotes);
    }
  }, 50);
});

onValue(ref(db, 'revealed'), (snapshot) => {
  currentRevealed = snapshot.val() || false;
  updateUI();
});
