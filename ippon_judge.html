<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPPON - 審査員</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
[data-netlify-badge], a[href*="netlify.com"] { display: none !important; }
html, body { overflow: hidden; height: 100%; }
</style>
<script>
// NetlifyバッジをJSで定期的に削除
function removeNetlifyBadge() {
  document.querySelectorAll('[data-netlify-badge], a[href*="netlify.com"]').forEach(el => el.remove());
  const iframes = document.querySelectorAll('iframe');
  iframes.forEach(f => { if (f.src && f.src.includes('netlify')) f.remove(); });
}
document.addEventListener('DOMContentLoaded', removeNetlifyBadge);
setInterval(removeNetlifyBadge, 1000);
</script>
<style>
body { background: #000; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; -webkit-text-size-adjust: 100%; overflow: hidden; }
.logo { font-size: 11px; color: #d4a017; font-weight: 900; letter-spacing: 3px; text-align: center; margin-bottom: 16px; }

#view-select { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; }
.select-title { font-size: 14px; color: #aaa; font-weight: 700; letter-spacing: 2px; text-align: center; margin-bottom: 14px; }
.select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.select-btn { background: #1a1a1a; border: 2px solid #d4a017; border-radius: 10px; color: #d4a017; font-size: 15px; font-weight: 900; padding: 22px 0; cursor: pointer; text-align: center; transition: background 0.1s; }
.select-btn.small { font-size: 12px; }
.select-btn:active { background: #2a2000; }

#view-vote { width: 100%; max-width: 320px; display: none; flex-direction: column; align-items: center; gap: 16px; }
.vote-btn { width: 100%; border: none; border-radius: 12px; font-size: 26px; font-weight: 900; padding: 70px 0; cursor: pointer; text-align: center; transition: opacity 0.1s; }
.vote-btn.active { background: #d4a017; color: #111; }
.vote-btn.active:active { opacity: 0.85; }
.vote-btn.voted { background: #333; color: #555; cursor: default; }
.vote-btn.locked { background: #222; color: #444; cursor: default; }
.vote-sub { font-size: 13px; display: block; margin-top: 8px; }
.back-link { font-size: 12px; color: #555; text-decoration: underline; cursor: pointer; background: none; border: none; }

#all-btn { position: fixed; bottom: 14px; left: 14px; background: none; border: 1px solid #333; border-radius: 4px; color: #444; font-size: 10px; padding: 4px 8px; cursor: pointer; }

#view-all { width: 100%; max-width: 320px; display: none; flex-direction: column; align-items: center; gap: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.seat-btn { background: #d4a017; border: none; border-radius: 8px; color: #111; font-size: 16px; font-weight: 900; padding: 22px 0; cursor: pointer; text-align: center; transition: transform 0.1s; }
.seat-btn:active { transform: scale(0.95); }
.seat-btn.voted { background: #333; color: #555; cursor: default; }
.seat-btn.locked { background: #222; color: #444; cursor: default; }
</style>
</head>
<body>

<div id="view-select">
  <div class="logo">IPPON GRAND PRIX</div>
  <div class="select-title">審査員選択</div>
  <div class="select-grid" id="select-grid"></div>
</div>

<div id="view-vote">
  <div class="logo">IPPON GRAND PRIX</div>
  <button class="vote-btn active" id="vote-btn" onclick="doVote()"><span id="vote-name"></span><span class="vote-sub" id="vote-sub"></span></button>
  <button class="back-link" onclick="goBack()">戻る</button>
</div>

<div id="view-all">
  <div class="logo">IPPON GRAND PRIX</div>
  <div class="grid" id="grid"></div>
  <button class="back-link" onclick="goBackFromAll()">戻る</button>
</div>

<button id="all-btn" onclick="showAll()">全員</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-mISssQxyO67vl3JxbbBktqXoDvmGLdk",
  authDomain: "song-fes-ippon-gp.firebaseapp.com",
  databaseURL: "https://song-fes-ippon-gp-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "song-fes-ippon-gp",
  storageBucket: "song-fes-ippon-gp.firebasestorage.app",
  messagingSenderId: "727959135173",
  appId: "1:727959135173:web:5d983f22d1164a11a6e1ac"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const votesRef = ref(db, 'votes');

const seatNames = {
  1: 'KIHARA', 2: 'HARADA', 3: 'SHIBUTANI',
  4: 'KIYOSHIMA', 5: 'NAKAMURA', 6: 'HAMADA',
  7: '会場審査員1', 8: '会場審査員2', 9: '会場審査員3', 10: '会場審査員4',
};

let currentVotes = {};
let isRevealed = false;
let isSaitenMode = false;
let selectedSeat = null;
let previousView = 'select';

const selectGrid = document.getElementById('select-grid');
for (let i = 1; i <= 10; i++) {
  const btn = document.createElement('button');
  btn.className = 'select-btn' + (i >= 7 ? ' small' : '');
  btn.textContent = seatNames[i];
  btn.onclick = () => selectSeat(i);
  selectGrid.appendChild(btn);
}

function selectSeat(seat) {
  selectedSeat = seat;
  document.getElementById('vote-name').textContent = seatNames[seat];
  showView('vote');
  updateVoteBtn();
}

function showView(view) {
  document.getElementById('view-select').style.display = 'none';
  document.getElementById('view-vote').style.display = 'none';
  document.getElementById('view-all').style.display = 'none';
  if (view === 'select') document.getElementById('view-select').style.display = 'flex';
  else if (view === 'vote') document.getElementById('view-vote').style.display = 'flex';
  else if (view === 'all') document.getElementById('view-all').style.display = 'flex';
}

window.goBack = () => showView('select');
window.showAll = () => { previousView = selectedSeat ? 'vote' : 'select'; showView('all'); renderAll(currentVotes); };
window.goBackFromAll = () => showView(previousView);

window.doVote = () => {
  if (!selectedSeat) return;
  const totalVotes = Object.keys(currentVotes).length;
  if (!isSaitenMode || isRevealed || currentVotes[selectedSeat] || totalVotes >= 6) return;
  set(ref(db, `votes/${selectedSeat}`), true);
};

function updateVoteBtn() {
  if (!selectedSeat) return;
  const btn = document.getElementById('vote-btn');
  const sub = document.getElementById('vote-sub');
  const isIppon = Object.keys(currentVotes).length >= 6;
  const isVoted = currentVotes[selectedSeat];
  if (isRevealed || isIppon) {
    btn.className = 'vote-btn locked';
    sub.textContent = '採点終了';
  } else if (!isSaitenMode) {
    btn.className = 'vote-btn locked';
    sub.textContent = '採点中ではありません';
  } else if (isVoted) {
    btn.className = 'vote-btn voted';
    sub.textContent = '✓ 投票済み';
  } else {
    btn.className = 'vote-btn active';
    sub.textContent = '';
  }
}

function renderAll(votes) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const isIppon = Object.keys(votes).length >= 6;
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    const isVoted = votes[i] === true;
    const label = seatNames[i];
    if (isRevealed || isIppon) {
      btn.className = 'seat-btn locked';
      btn.textContent = isVoted ? label + ' ✓' : label;
    } else if (!isSaitenMode) {
      btn.className = 'seat-btn locked';
      btn.textContent = label;
    } else {
      btn.className = 'seat-btn' + (isVoted ? ' voted' : '');
      btn.textContent = isVoted ? label + ' ✓' : label;
    }
    btn.onclick = () => {
      const total = Object.keys(currentVotes).length;
      if (!isSaitenMode || isRevealed || currentVotes[i] || total >= 6) return;
      set(ref(db, `votes/${i}`), true);
    };
    grid.appendChild(btn);
  }
}

onValue(ref(db, 'mode'), (snapshot) => {
  isSaitenMode = snapshot.val() === 'saiten';
  updateVoteBtn();
  renderAll(currentVotes);
});
onValue(ref(db, 'revealed'), (snapshot) => {
  isRevealed = snapshot.val() || false;
  updateVoteBtn();
  renderAll(currentVotes);
});
onValue(votesRef, (snapshot) => {
  currentVotes = snapshot.val() || {};
  updateVoteBtn();
  renderAll(currentVotes);
});
</script>
</body>
</html>
