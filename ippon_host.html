<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPPON - 司会</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
html, body { overflow: hidden; height: 100%; }
body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 8px; min-height: 100vh; }
h1 { color: #f5c400; font-size: 14px; letter-spacing: 2px; margin-bottom: 6px; }
#vote-count { font-size: 72px; font-weight: 900; color: #f5c400; line-height: 1; }
#vote-label { font-size: 14px; color: #aaa; margin-bottom: 10px; }

/* 3列4行グリッド */
#grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto auto auto auto;
  gap: 8px 12px;
  width: 94vw;
}

.btn {
  padding: 14px 0;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  width: 100%;
  color: #fff;
  background: #333;
}
.btn:active { opacity: 0.7; }

/* モードタブ */
.mode-btn { background: #2a2a2a; color: #888; border-radius: 8px 8px 0 0; }
.mode-btn.active { background: #00aaff; color: #000; }

/* お題ボタン */
.odai-btn { background: #1a3a1a; color: #4cff4c; font-size: 13px; }
.odai-read-btn { background: #1a2a3a; color: #4ca8ff; font-size: 13px; }

/* 採点系 */
.reveal-btn { background: #c8a000; color: #000; }
.reset-btn { background: #2a1a1a; color: #ff6666; border: 1px solid #ff4444; }

/* 笑い */
.laugh-btn { background: #2a1a2a; color: #ff88ff; border: 1px solid #aa44aa; }

/* スコア */
.score-btn { background: #004400; color: #44ff44; border-radius: 8px 0 0 8px; padding: 14px 0; }
.score-btn-minus { background: #440000; color: #ff4444; border-radius: 0 8px 8px 0; padding: 14px 0; }
.score-label { color: #aaa; font-size: 10px; text-align: center; }
.score-num { color: #fff; font-size: 18px; font-weight: 900; text-align: center; }

/* 出題・シンキング */
.shutsudai-btn { background: #1a1a3a; color: #88aaff; border: 1px solid #4466cc; }
.thinking-btn { background: #1a1a3a; color: #88aaff; border: 1px solid #4466cc; }
.btn.playing { background: #aa6600 !important; color: #fff !important; }

/* ボリューム */
#vol-wrap { display: none; }
#vol-slider { display: none; }
#vol-label { display: none; }
</style>



<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js';
import { getDatabase, ref, set, remove, onValue, get } from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-mISssQxyO67vl3JxbbBktqXoDvmGLdk",
  authDomain: "song-fes-ippon-gp.firebaseapp.com",
  databaseURL: "https://song-fes-ippon-gp-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "song-fes-ippon-gp",
  storageBucket: "song-fes-ippon-gp.firebasestorage.app",
  messagingSenderId: "727959135173",
  appId: "1:727959135173:web:5d983f22d1164a11a6e1ac"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let masterVolume = 1.0;
let currentScores = [0,0,0,0,0];

// Web Audio API unlock + new Audio()方式
const BASE = 'https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3%2F';
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioUnlocked = false;

window.unlockAudio = async () => {
  if (audioUnlocked) return;
  await audioCtx.resume();
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
  const unlockList = [...Object.values(sounds), sound10, soundIppon, ...Object.values(odaiAudios), ...Object.values(laughAudios), noIpponAudio, shutsudaiAudio, thinkingAudio, ...Object.values(agendaAudios)];
  for (const a of unlockList) {
    a.volume = 0;
    try { await a.play(); a.pause(); a.currentTime = 0; a.volume = masterVolume; } catch(e) {}
  }
  audioUnlocked = true;
};

// 最初のクリックで自動unlock
document.addEventListener('click', () => window.unlockAudio(), { once: true });
document.addEventListener('touchstart', () => window.unlockAudio(), { once: true });

setInterval(() => audioCtx.resume(), 30000);

// 音声URL（BASE は上部で定義済み）
const sounds = {
  "1": new Audio(BASE + '1.mp3?alt=media'),
  "2": new Audio(BASE + '2.mp3?alt=media'),
  "3": new Audio(BASE + '3.mp3?alt=media'),
  "4": new Audio(BASE + '4.mp3?alt=media'),
  "5": new Audio(BASE + '5.mp3?alt=media'),
};
// ===== 投票音をAudioBufferで事前デコード（ほぼ遅延ゼロ再生） =====
const voteSoundUrls = {
  "1": BASE + '1.mp3?alt=media',
  "2": BASE + '2.mp3?alt=media',
  "3": BASE + '3.mp3?alt=media',
  "4": BASE + '4.mp3?alt=media',
  "5": BASE + '5.mp3?alt=media',
  "6": BASE + '6.mp3?alt=media',
};
const voteBuffers = {};

async function loadVoteBuffer(key, url) {
  try {
    const res = await fetch(url);
    const arr = await res.arrayBuffer();
    voteBuffers[key] = await audioCtx.decodeAudioData(arr);
  } catch(e) { console.warn('Buffer load failed:', key, e); }
}
// 全投票音をバックグラウンドでデコード
Object.entries(voteSoundUrls).forEach(([k, url]) => loadVoteBuffer(k, url));

function playVoteBuffer(key) {
  const buf = voteBuffers[key];
  if (!buf || !audioCtx) return false;
  try {
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.value = masterVolume;
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(0);
    return src; // onendedをセットできるように返す
  } catch(e) { return false; }
}
const sound10 = new Audio(BASE + '6.mp3?alt=media');
const soundIppon = new Audio(BASE + 'IPPON.mp3?alt=media');
const shutsudaiAudio = new Audio(BASE + encodeURIComponent('出題音.mp3') + '?alt=media');
const thinkingAudio = new Audio(BASE + encodeURIComponent('ルイジアナ.mp3') + '?alt=media');
thinkingAudio.loop = true;
const odaiAudios = {
  1: new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3_question%2Fmp3_question1.mp3?alt=media&token=ee2b6513-85bc-4574-bfee-b0463a61b3be'),
  2: new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3_question%2Fmp3_question2.mp3?alt=media&token=b58afff7-81bf-4171-9773-9ee1ebd8a8fe'),
  3: new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3_question%2Fmp3_question3.mp3?alt=media&token=64b35bfd-51df-4b46-ae81-57c6c3b0654e'),
  4: new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3_question%2Fmp3_question4.mp3?alt=media&token=52e29daf-5205-460b-b571-f82b5ec21c80'),
  5: new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3_question%2Fmp3_question5.mp3?alt=media&token=d6f5173d-8e8e-42da-9e5c-268f5e9ec793'),
  6: new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3_question%2Fmp3_question6.mp3?alt=media&token=84ab47b2-eadc-4bd2-b0ca-d3b7b5574c4a'),
};
const noIpponAudio = new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3%2Fno-ippon.mp3?alt=media');
const laughAudios = {
  1: new Audio(BASE + 'laugh1.mp3?alt=media'),
  2: new Audio(BASE + 'laugh2.mp3?alt=media'),
  3: new Audio(BASE + 'laugh3.mp3?alt=media'),
  4: new Audio(BASE + 'laugh4.mp3?alt=media'),
};
const agendaAudios = {
  se_cheer:  new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3%2Fmp3_%E6%AD%93%E5%A3%B0.mp3?alt=media&token=e2d04e49-58e2-474b-81df-0217e7e5c344'),
  se_clap:   new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3%2Fmp3_%E6%8B%8D%E6%89%8B.mp3?alt=media&token=d351f6a4-8313-48aa-ae27-2f887ad26790'),
  se_buzzer: new Audio('https://firebasestorage.googleapis.com/v0/b/song-fes-ippon-gp.firebasestorage.app/o/mp3%2Fsyuryo.mp3?alt=media&token=83cb1ec0-1243-4a38-a360-61a05073647e'),
};

// 全音声リスト
const allAudios = [...Object.values(sounds), sound10, soundIppon, shutsudaiAudio, thinkingAudio, noIpponAudio,
  ...Object.values(odaiAudios), ...Object.values(laughAudios), ...Object.values(agendaAudios)];

// 読み込み中オーバーレイ
const overlay = document.createElement('div');
overlay.id = 'loading-overlay';
overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;';
overlay.innerHTML = '<div style="color:#f5c400;font-size:22px;font-weight:900;">読み込み中...</div><div id="load-progress" style="color:#aaa;font-size:14px;">0 / ' + allAudios.length + '</div>';
document.body.appendChild(overlay);

// 全音声ロード＆進捗表示
let loadedCount = 0;
const progressEl = document.getElementById('load-progress');
allAudios.forEach(a => {
  a.addEventListener('canplaythrough', () => {
    loadedCount++;
    progressEl.textContent = loadedCount + ' / ' + allAudios.length;
    if (loadedCount >= allAudios.length) {
      overlay.style.transition = 'opacity 0.5s';
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 500);
    }
  }, { once: true });
  a.load();
});

// 10秒後に強制的にオーバーレイを消す
setTimeout(() => {
  if (overlay.parentNode) {
    overlay.style.transition = 'opacity 0.5s';
    overlay.style.opacity = '0';
    setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 500);
  }
}, 10000);

// 5分おきに全音声を再ロード（キャッシュ維持）
setInterval(() => allAudios.forEach(a => { if (a.paused) a.load(); }), 5 * 60 * 1000);

function setVol(audio) { audio.volume = masterVolume; }
window.setVolume = (v) => {
  masterVolume = v / 100;
  document.getElementById('vol-label').textContent = v + '%';
  [sounds[1],sounds[2],sounds[3],sounds[4],sounds[5],sound10,soundIppon,shutsudaiAudio,thinkingAudio,noIpponAudio,...Object.values(odaiAudios),...Object.values(laughAudios),...Object.values(agendaAudios)].forEach(a => { if (a) a.volume = masterVolume; });
};

// 投票音キュー
let soundQueue = [];
let isPlaying = false;
let prevVoteCount = 0;

function enqueueVoteSound(count) {
  soundQueue.push(count);
  if (!isPlaying) playNextInQueue();
}
function playNextInQueue() {
  if (soundQueue.length === 0) { isPlaying = false; return; }
  isPlaying = true;
  const c = soundQueue.shift();
  if (c >= 6) {
    // 6票目: バッファ優先、なければnew Audio
    const src = playVoteBuffer("6");
    if (src) {
      src.onended = () => {
        soundIppon.volume = masterVolume;
        soundIppon.currentTime = 0;
        soundIppon.play().catch(()=>{});
        soundIppon.onended = () => setTimeout(playNextInQueue, 150);
      };
    } else {
      sound10.volume = masterVolume;
      sound10.currentTime = 0;
      sound10.play().catch(()=>{});
      sound10.onended = () => {
        soundIppon.volume = masterVolume;
        soundIppon.currentTime = 0;
        soundIppon.play().catch(()=>{});
        soundIppon.onended = () => setTimeout(playNextInQueue, 150);
      };
    }
    return;
  }
  // 1〜5票: バッファ優先、なければnew Audio
  const key = String(c);
  const played = playVoteBuffer(key);
  if (!played) {
    const audio = sounds[key];
    if (audio) {
      audio.volume = masterVolume;
      audio.currentTime = 0;
      audio.play().catch(()=>{});
    }
  }
  setTimeout(playNextInQueue, 50);
}

window.toggleAudio = function(audio, btnId) {
  const btn = document.getElementById(btnId);
  const origText = btn.textContent.replace('■ ', '');
  if (!audio.paused) {
    audio.pause();
    audio.currentTime = 0;
    btn.classList.remove('playing');
    btn.textContent = origText;
  } else {
    audio.volume = masterVolume;
    audio.play().then(() => {
      btn.classList.add('playing');
      btn.textContent = '■ ' + origText;
      audio.onended = () => {
        btn.classList.remove('playing');
        btn.textContent = origText;
      };
    }).catch((e) => {
      console.error('Audio play error:', e, audio.src);
      btn.classList.remove('playing');
      btn.textContent = origText;
    });
  }
}

  const { key, action } = data;
  const audio = seAudioMap[key];

    if (currentSEKey && currentSEKey !== key) {
      const prev = seAudioMap[currentSEKey];

    audio.volume = masterVolume;

</div>

<div id="sub-result" style="display:none;position:fixed;inset:0;background:#0a0a0a;z-index:8000;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;gap:12px;overflow-y:auto;">
  <div style="width:100%;display:flex;align-items:center;margin-bottom:8px;">
    <button onclick="hideSubScreen()" style="background:none;border:1px solid #444;color:#aaa;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;">← 戻る</button>
    <div style="flex:1;text-align:center;font-size:14px;color:#d4a017;font-weight:900;letter-spacing:2px;">結果モード</div>
  </div>
  <div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;" id="result-score-grid"></div>
  <button onclick="window.resetScores()" style="width:100%;background:#2a0a0a;border:2px solid #aa2222;color:#ff6666;font-size:16px;font-weight:900;padding:16px;border-radius:14px;cursor:pointer;margin-top:8px;">スコアリセット</button>
</div>

<!-- SE サブ画面 -->
<div id="sub-se" style="display:none;position:fixed;inset:0;background:#0a0a0a;z-index:8000;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;gap:10px;overflow-y:auto;">
  <div style="width:100%;display:flex;align-items:center;margin-bottom:8px;">
    <button onclick="hideSubScreen()" style="background:none;border:1px solid #444;color:#aaa;font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer;">← 戻る</button>
    <div style="flex:1;text-align:center;font-size:14px;color:#d4a017;font-weight:900;letter-spacing:2px;">SE操作</div>
  </div>
  <div style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <button id="sub-laugh-btn-1" onclick="window.triggerSE('laugh_1')" style="background:#2a0a2a;border:2px solid #aa44aa;color:#ff88ff;font-size:18px;font-weight:900;padding:24px;border-radius:14px;cursor:pointer;">笑い1</button>
    <button id="sub-laugh-btn-2" onclick="window.triggerSE('laugh_2')" style="background:#2a0a2a;border:2px solid #aa44aa;color:#ff88ff;font-size:18px;font-weight:900;padding:24px;border-radius:14px;cursor:pointer;">笑い2</button>
    <button id="sub-laugh-btn-3" onclick="window.triggerSE('laugh_3')" style="background:#2a0a2a;border:2px solid #aa44aa;color:#ff88ff;font-size:18px;font-weight:900;padding:24px;border-radius:14px;cursor:pointer;">笑い3</button>
    <button id="sub-laugh-btn-4" onclick="window.triggerSE('laugh_4')" style="background:#2a0a2a;border:2px solid #aa44aa;color:#ff88ff;font-size:18px;font-weight:900;padding:24px;border-radius:14px;cursor:pointer;">笑い4</button>
    <button id="sub-se-cheer-btn" onclick="window.triggerSE('se_cheer')" style="background:#1a1a3a;border:2px solid #4444aa;color:#8888ff;font-size:18px;font-weight:900;padding:24px;border-radius:14px;cursor:pointer;">歓声</button>
    <button id="sub-se-clap-btn" onclick="window.triggerSE('se_clap')" style="background:#1a1a3a;border:2px solid #4444aa;color:#8888ff;font-size:18px;font-weight:900;padding:24px;border-radius:14px;cursor:pointer;">拍手</button>
  </div>
</div>

<script>
window.goFullscreen = () => {
  document.documentElement.requestFullscreen();
  document.getElementById('fullscreen-btn-host').style.display = 'none';
};
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.getElementById('fullscreen-btn-host').style.display = '';
  }
});

// サブ画面
const playerNames = ['WAKUSHIMA','AGATA','TOKUMOTO','AOKI','SAGAWA'];
function buildResultGrid() {
  const grid = document.getElementById('result-score-grid');
  if (!grid) return;
  grid.innerHTML = '';
  playerNames.forEach((name, i) => {
    const pi = 4 - i;
    const cell = document.createElement('div');
    cell.style.cssText = 'background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;';
    cell.innerHTML = `
      <div style="font-size:11px;color:#aaa;font-weight:900;">${name}</div>
      <div id="sub-score-${pi}" style="font-size:28px;font-weight:900;color:#f5c400;">0</div>
      <div style="display:flex;gap:8px;">
        <button onclick="window.changeScore(${pi},1)" style="background:#1a3a1a;border:1px solid #44aa44;color:#88ff88;font-size:20px;width:44px;height:44px;border-radius:8px;cursor:pointer;">＋</button>
        <button onclick="window.changeScore(${pi},-1)" style="background:#3a1a1a;border:1px solid #aa4444;color:#ff8888;font-size:20px;width:44px;height:44px;border-radius:8px;cursor:pointer;">－</button>
      </div>`;
    grid.appendChild(cell);
  });
}

const isSP = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;

window.showSubScreen = (type) => {
  document.getElementById('sub-select').style.display = 'none';
  document.getElementById('sub-result').style.display = type === 'result' ? 'flex' : 'none';
  document.getElementById('sub-se').style.display = type === 'se' ? 'flex' : 'none';
  if (type === 'result') buildResultGrid();
};
window.hideSubScreen = () => {
  document.getElementById('sub-result').style.display = 'none';
  document.getElementById('sub-se').style.display = 'none';
  if (isSP) {
    document.getElementById('sub-select').style.display = 'flex';
  }
};

// SP検知: PC用UIを隠して選択画面を表示
if (isSP) {
  document.getElementById('pc-btns').style.display = 'none';
  document.getElementById('vol-wrap').style.display = 'none';
  document.getElementById('sub-select').style.display = 'flex';
}
</script>
</body>
</html>
